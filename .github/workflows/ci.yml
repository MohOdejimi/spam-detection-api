name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      - name: Download NLTK data
        run: python -m nltk.downloader punkt punkt_tab stopwords

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Test with pytest
        run: pytest --cov=app --cov-report=xml

      - name: Build Docker image
        run: docker compose build

  publish:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker compose build

      - name: Tag Docker image
        run: |
          OWNER_LC="${{ github.repository_owner }}"
          OWNER_LC="${OWNER_LC,,}"
          docker tag spam-detection-api-api:latest ghcr.io/${OWNER_LC}/spam-detection-api:${{ github.sha }}

      - name: Push Docker image
        run: |
          OWNER_LC="${{ github.repository_owner }}"
          OWNER_LC="${OWNER_LC,,}"
          docker push ghcr.io/${OWNER_LC}/spam-detection-api:${{ github.sha }}
  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps: 
      - name: Set up SSH KEY 
        run: |
          echo "${{ secrets.AZURE_VM_SSH_KEY }}" > vm_key.pem
          chmod 600 vm_key.pem

      - name: Test SSH Connection 
        run: |
          ssh -i vm_key.pem \
            -o StrictHostKeyChecking=no \
            "${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_IP }}" \
            "echo 'SSH Connection Successful'"

      - name: Pull and Deploy Image 
        run: |
          OWNER_LC="${{ github.repository_owner }}"
          OWNER_LC="${OWNER_LC,,}"

          ssh -i vm_key.pem \
            "${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_IP }}" \
            "
   
             docker pull ghcr.io/${OWNER_LC}/spam-detection-api:${{ github.sha }}
              if docker ps -a --format '{{.Names}}' | grep -q '^spam-detection-api$'; then
                  docker stop spam-detection-api 
                docker rm spam-detection-api
              fi
              docker run --restart unless-stopped -d -p8000:8000 --name spam-detection-api  ghcr.io/${OWNER_LC}/spam-detection-api:${{ github.sha }}
            "  