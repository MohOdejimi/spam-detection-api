on: [push]

jobs:
  build_and_publish_image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      - name: Download NLTK data
        run: python -m nltk.downloader punkt punkt_tab stopwords

      - name: Lint with Ruff
        run: ruff check --output-format=github

      - name: Check formatting with Ruff
        run: ruff format --diff
        continue-on-error: true

      - name: Test with pytest
        run: pytest ./tests/test_predictions.py --cov=app --cov-report=xml

      - name: Build Docker image
        run: docker compose build

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3 
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Tag Docker Image
        run: docker tag spam-detection-api-api:latest ghcr.io/${{ env.OWNER_LC }}/spam-detection-api:${{ github.sha }}

      - name: Push Docker Image
        run: docker push ghcr.io/${{ env.OWNER_LC }}/spam-detection-api:${{ github.sha }}