name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      - name: Download NLTK data
        run: python -m nltk.downloader punkt punkt_tab stopwords

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Test with pytest
        run: pytest --cov=app --cov-report=xml

  publish:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker compose build

      - name: Tag Docker image
        run: |
          OWNER_LC="${{ github.repository_owner }}"
          OWNER_LC="${OWNER_LC,,}"
          docker tag spam-detection-api-api:latest ghcr.io/${OWNER_LC}/spam-detection-api:${{ github.sha }}

      - name: Push Docker image
        run: |
          OWNER_LC="${{ github.repository_owner }}"
          OWNER_LC="${OWNER_LC,,}"
          docker push ghcr.io/${OWNER_LC}/spam-detection-api:${{ github.sha }}
  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps: 
      - name: Set up SSH KEY 
        run: |
          echo "${{ secrets.AZURE_VM_SSH_KEY }}" > vm_key.pem
          chmod 600 vm_key.pem

      - name: Create SSH Known Hosts 
        run: |
          echo "${{ secrets.AZURE_VM_KNOWN_HOSTS }}" > known_hosts
          chmod 600 known_hosts

      - name: Test SSH Connection 
        run: |
          ssh -i vm_key.pem \
            -o UserKnownHostsFile=known_hosts \
            "${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_IP }}" \
            "echo 'SSH Connection Successful'"

      - name: Pull and Deploy Image
        run: |
          OWNER_LC="${{ github.repository_owner }}"
          OWNER_LC="${OWNER_LC,,}"

          ssh -i vm_key.pem \
            -o UserKnownHostsFile=known_hosts \
            "${{ secrets.AZURE_VM_USERNAME }}@${{ secrets.AZURE_VM_IP }}" \

            "
              set -e

              IMAGE='ghcr.io/${OWNER_LC}/spam-detection-api:${{ github.sha }}'
              REPOSITORY='ghcr.io/${OWNER_LC}/spam-detection-api'

              echo 'Pulling new image...'
              docker pull \$IMAGE

              if docker ps -a --format '{{.Names}}' | grep -q '^spam-detection-api$'; then
                echo 'Stopping existing container...'
                docker stop spam-detection-api
                docker rm spam-detection-api
              fi

              echo 'Starting new container...'
              docker run \
                --restart unless-stopped \
                -d \
                -p 8000:8000 \
                --name spam-detection-api \
                --health-cmd='python -c \"import urllib.request; urllib.request.urlopen(\\\"http://localhost:8000/health\\\")\"' \
                --health-interval=10s \
                --health-retries=3 \
                --health-start-period=10s \
                \$IMAGE

              echo 'Waiting for health check...'
              sleep 7

              HEALTH_STATUS=\$(docker inspect \
                --format='{{.State.Health.Status}}' \
                spam-detection-api)

              echo \"Health status: \$HEALTH_STATUS\"

              if [ \"\$HEALTH_STATUS\" != 'healthy' ]; then
                echo 'Deployment failed health check.'
                docker logs spam-detection-api
                exit 1
              fi

              echo 'Container is healthy.'

              CURRENT_IMAGE_ID=\$(docker inspect \
                --format='{{.Image}}' \
                spam-detection-api)

              docker images \
                \"\$REPOSITORY\" \
                --format '{{.ID}} {{.Repository}}:{{.Tag}}' |
                while read IMAGE_ID IMAGE_REF; do
                  if [ \"\$IMAGE_ID\" != \"\$CURRENT_IMAGE_ID\" ]; then
                    docker rmi \"\$IMAGE_REF\" || true
                  fi
                done

              echo 'Targeted image cleanup completed.'
            "